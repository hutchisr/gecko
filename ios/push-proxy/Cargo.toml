[package]
name = "gecko-push-proxy"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
env_logger = "0.11"
futures = "0.3"
jsonwebtoken = "9"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
sasl = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-xmpp = { version = "6", default-features = false, features = ["starttls", "ring", "rustls-native-certs"] }
xmpp-parsers = "0.23"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "io-util", "net"] }
bytes = "1"
h2 = "0.4"
http = "1"

[profile.release]
lto = "thin"
strip = true
